name: Verify & Test UK Platform Advisor

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Test Calculator Engine & Platform Fee Models
        run: |
          node -e "
            const calc = require('./calculator');
            const res = calc.compareAllPlatforms({
              accounts: { isa: true, sipp: true, gia: true },
              lumpSums: { isa: 30000, sipp: 70000, gia: 20000 },
              monthlyContrib: { isa: 500, sipp: 500, gia: 250 },
              assetAllocation: { ukSharesPct: 30, etfsPct: 30, fundsPct: 20, investmentTrustsPct: 10, usStocksPct: 10, europeanStocksPct: 0 },
              tradingFrequency: { ukShareTradesPerYear: 8, fundTradesPerYear: 4, overseasTradesPerYear: 6, avgOverseasTradeSize: 1500 },
              sippEmployerContrib: true,
              pensionWithdrawal: 'accumulation',
              horizonYears: 10,
              expectedReturnRate: 0.06
            });
            console.log('Evaluated platforms successfully:', res.length);
            if (res.length !== 6) process.exit(1);
          "
